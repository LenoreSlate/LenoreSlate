<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Lenore Slate — TypeScript developer and product designer</title>
  <desc id="d">Terminal-style banner. whoami: Lenore Slate, TypeScript developer and product designer. A space where code meets the human experience.</desc>
  <defs>
    <radialGradient id="glow" cx="88%" cy="0%" r="70%">
      <stop offset="0" stop-color="#1793D1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect width="960" height="330" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .l { opacity: 0; animation: in .6s ease-out forwards; }
    .l1 { animation-delay: .15s; } .l2 { animation-delay: .55s; } .l3 { animation-delay: .95s; }
    .l4 { animation-delay: 1.35s; } .l5 { animation-delay: 1.75s; }
    .cursor { animation: blink 1.1s steps(1) infinite; animation-delay: 2.2s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .l, .cursor, .pulse { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#panel)">
    <rect width="960" height="330" fill="#f6f8fa"/>
    <rect width="960" height="330" fill="url(#glow)"/>
    <rect width="960" height="46" fill="#eaeef2"/>
    <rect y="46" width="960" height="1" fill="#d0d7de"/>
  </g>
  <rect x=".5" y=".5" width="959" height="329" rx="15.5" fill="none" stroke="#d0d7de"/>

  <!-- window chrome -->
  <circle cx="30" cy="23" r="6" fill="#c9d1d9"/><circle cx="52" cy="23" r="6" fill="#c9d1d9"/><circle cx="74" cy="23" r="6" fill="#c9d1d9"/>
  <text class="mono" x="480" y="28" text-anchor="middle" font-size="13" fill="#59636e">lenore@slate: ~/lenore_slate</text>

  <!-- status pill -->
  <g class="l l5">
    <rect x="768" y="70" width="162" height="30" rx="15" fill="none" stroke="#1793D1" stroke-opacity=".55"/>
    <circle class="pulse" cx="788" cy="85" r="4.5" fill="#1793D1"/>
    <text class="mono" x="802" y="90" font-size="13" fill="#0b6ea8">in progress</text>
  </g>

  <!-- whoami -->
  <g class="l l1">
    <text class="mono" x="34" y="96" font-size="19" fill="#0b6ea8">$</text>
    <text class="mono" x="56" y="96" font-size="19" fill="#1f2328">whoami</text>
  </g>
  <g class="l l2">
    <text class="mono" x="34" y="150" font-size="46" font-weight="700" fill="#1f2328" letter-spacing="-1">Lenore Slate</text>
    <text class="mono" x="34" y="184" font-size="20" fill="#0b6ea8">TypeScript developer · product designer</text>
  </g>

  <!-- about -->
  <g class="l l3">
    <text class="mono" x="34" y="232" font-size="19" fill="#0b6ea8">$</text>
    <text class="mono" x="56" y="232" font-size="19" fill="#1f2328">cat about.txt</text>
  </g>
  <g class="l l4">
    <text class="mono" x="34" y="264" font-size="18" fill="#59636e">A space where code meets the human experience.</text>
  </g>

  <!-- idle prompt -->
  <g class="l l5">
    <text class="mono" x="34" y="306" font-size="19" fill="#0b6ea8">$</text>
    <rect class="cursor" x="58" y="291" width="11" height="19" fill="#1793D1"/>
  </g>
</svg>
